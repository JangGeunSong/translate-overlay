<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Context Reader smoke fixture</title>
    <style>
      body { max-width: 700px; margin: 80px auto; font: 18px/1.55 system-ui; }
      .spacer { height: 900px; }
    </style>
  </head>
  <body>
    <main id="source">
      <h1>Welcome to the example website</h1>
      <p>The proposal was eventually shelved due to mounting regulatory pressure.</p>
      <button id="continue">Continue reading</button>
      <div class="spacer"></div>
      <p>Learn more about this dynamic page.</p>
    </main>
    <script>
      window.initialSourceMarkup = document.querySelector("#source").outerHTML;
      document.querySelector("#continue").addEventListener("click", () => {
        document.body.dataset.buttonWorked = "true";
      });
    </script>
  </body>
</html>
